<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    	body{
    		background-image: url(lp.jpeg);
    		background-repeat: no-repeat;
    		background-size: cover;
    		height: 100vh;
    		margin: 0;
    		overflow: auto;
    		font-family: serif;
    	}
    	header{
    		background-color: whitesmoke;
    	}
    	div{
    		text-align: center;
    		color: darkblue;

    	}
    	h1{
    		 background-color: white;
    text-align: center;
    padding: 5px;
    margin-bottom: 15px;
    font-size: 20px;
    font-weight: normal;

    border: 1px solid black;
    	}
    	table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    font-size: 11px;
}

th, td {
    padding: 6px;
    text-align: center;
}
h1 {
    border: 2px solid black;
    padding: 10px;
    width: fit-content;
}

    </style>
</head>

<body>
	<header>Contact us</header>
	<div class="office">


    <h1>School Office Hours</h1>
    <table class="table table-hover">
        <tr class="table table-info">
            <th>Day</th>
            <th>Office Hours</th>
            <th>Department</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>8:00-4:00</td>
            <td>Register office</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>8:00-4:00</td>
            <td>Accounting office</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>8:00-4:00</td>
            <td>Guidance</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>8:00-4:00</td>
            <td>Principal office</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>8:00-4:00</td>
            <td>Faculty</td>

        </tr>
    </table>
    <h1>Contact Us</h1>
    <div>
        <form>
        	
        	<br>
        	<p>Full Name</p>
        	<textarea id="un" name="un" rows="1"
			cols="20"placeholder="Enter your Full Name"></textarea>
			<br>
        	<p>Email Adress</p>
        	<textarea id="un" name="un" rows="1"
			cols="20"placeholder="Enter your email"></textarea>
			<br>
        	<p>Subject</p>
        	<textarea id="un" name="un" rows="1"
			cols="20"placeholder="Enter your subject"></textarea>
			<br>
        	<p>Message</p>
        	<textarea id="un" name="un" rows="10"
			cols="30"placeholder="Type your message here"></textarea>
			<br>
			<input type="submit" value="Send Message">
        </form>
    </div>
    
       
</body>
</html>
